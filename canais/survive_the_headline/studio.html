<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Mesa de animação: grafite neutro para não competir com a cena, âmbar do canal na seleção ativa.
     Layout: palco grande fixo à esquerda, controles em coluna à direita. */
  --bg:#14161c;--panel:#1c1f28;--line:#2f3442;--ink:#eceef3;--muted:#9aa2b4;--accent:#ffb020;
  --display:"Anton","Impact","Arial Narrow Bold",sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
.app{max-width:1500px;margin:0 auto;padding:16px 20px;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 20px}
h1{margin:0;font:400 34px/1.1 var(--display);letter-spacing:.5px;text-transform:uppercase}
header p{margin:0;color:var(--muted)}
.bench{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:14px;align-items:start}
@media (max-width:1040px){.bench{grid-template-columns:1fr}}
.left{position:sticky;top:12px;display:flex;flex-direction:column;gap:10px}
@media (max-width:1040px){.left{position:static}}
.stage{aspect-ratio:16/9;width:100%;border:1px solid var(--line);border-radius:8px;overflow:hidden;--sq:#2a2e3a;--sq2:#23262f;background-color:var(--sq2);background-image:conic-gradient(var(--sq) 25%,var(--sq2) 0 50%,var(--sq) 0 75%,var(--sq2) 0);background-size:32px 32px}
.stage svg.sth-scene{display:block;width:100%;height:100%}
.bar{display:flex;flex-wrap:wrap;gap:6px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:14px}
.group{display:flex;flex-direction:column;gap:6px}
.group h2{margin:0;font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:5px}
.chips.wide{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
button{font:500 13.5px var(--body);color:var(--ink);background:#262a35;border:1px solid var(--line);border-radius:5px;padding:6px 8px;cursor:pointer;overflow-wrap:anywhere}
button:hover{border-color:var(--accent)}
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#1d1400;font-weight:600}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.readout{font:13px var(--mono);background:#101218;border:1px solid var(--line);border-radius:5px;padding:9px 11px;color:#d5dbe8;min-height:38px;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Character Studio</h1>
    <p>Survive the Headline · motor único · cinco personagens</p>
  </header>
  <div class="bench">
    <div class="left">
      <div class="stage" id="stage"></div>
      <div class="bar" id="actions"></div>
      <div class="readout" id="readout" aria-live="polite">Selecione um personagem.</div>
    </div>
    <aside class="panel" aria-label="Controles">
      <section class="group"><h2>Personagem</h2><div class="chips" id="c-who"></div></section>
      <section class="group"><h2>Visualização</h2><div class="chips" id="c-view"></div></section>
      <section class="group"><h2>Cenário</h2><div class="chips wide" id="c-scene"></div></section>
      <section class="group"><h2>Direção</h2><div class="chips" id="c-dir"></div></section>
      <section class="group"><h2>Animação</h2><div class="chips" id="c-anim"></div></section>
      <section class="group"><h2>Expressão</h2><div class="chips" id="c-expr"></div></section>
      <section class="group"><h2>Pose</h2><div class="chips wide" id="c-pose"></div></section>
      <section class="group" id="g-outfit"><h2>Figurino e cabelo</h2><div class="chips" id="c-outfit"></div></section>
      <section class="group"><h2>Acessórios: clique para alternar</h2><div class="chips wide" id="c-acc"></div></section>
    </aside>
  </div>
</div>
<script src="engine/SVGRenderer.js"></script>
<script src="engine/ExpressionEngine.js"></script>
<script src="engine/PoseController.js"></script>
<script src="engine/AnimationEngine.js"></script>
<script src="engine/LipSyncEngine.js"></script>
<script src="engine/CharacterEngine.js"></script>
<script src="engine/rigs/HumanRig.js"></script>
<script src="engine/rigs/QuadrupedRig.js"></script>
<script src="scenes/backdrops.js"></script>
<script src="scenes/family-scene.js"></script>
<script src="characters/dan/config.js"></script>
<script src="characters/mia/config.js"></script>
<script src="characters/leo/config.js"></script>
<script src="characters/bea/config.js"></script>
<script src="characters/biscuit/config.js"></script>
<script>
(async function () {
  const NAMES = { dan: 'Dan', mia: 'Mia', leo: 'Leo', bea: 'Bea', biscuit: 'Biscuit' };
  const DIRS = [['left', 'Perfil esq.'], ['three-quarter-left', '3/4 esq.'], ['front', 'Frente'], ['three-quarter-right', '3/4 dir.'], ['right', 'Perfil dir.']];
  const LINEUP = { dan: 330, mia: 660, leo: 980, bea: 1270, biscuit: 1580 };
  const stageEl = document.getElementById('stage');
  const scene = window.scene = CharacterEngine.createScene(stageEl);
  const readout = document.getElementById('readout');
  const log = t => { readout.textContent = t; };
  let who = 'dan', view = 'single', timers = [];
  const current = () => scene.cast[who];

  function chips(id, items, active, onPick) {
    const box = document.getElementById(id);
    box.textContent = '';
    items.forEach(([value, label]) => {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = label; b.dataset.value = value;
      b.setAttribute('aria-pressed', String(value === active));
      b.addEventListener('click', () => {
        Array.from(box.children).forEach(x => x.setAttribute('aria-pressed', String(x === b)));
        onPick(value);
      });
      box.appendChild(b);
    });
  }
  const stopScript = () => { timers.forEach(clearTimeout); timers = []; };

  function renderControls() {
    const c = current();
    if (!c) return;
    const s = c.getState();
    const name = c.name;
    chips('c-dir', DIRS, s.direction, v => { c.setDirection(v); log(`${name}.setDirection('${v}');`); });
    chips('c-anim', c.animations.map(a => [a, a]), s.animation === 'talk' ? 'talk' : s.animation, v => { c.play(v); log(`${name}.play('${v}');`); });
    chips('c-expr', c.expressions.map(e => [e, e]), s.expression, v => { c.setExpression(v); log(`${name}.setExpression('${v}');`); });
    chips('c-pose', c.poses.map(p => [p, p]), s.pose, v => { c.setPose(v); log(`${name}.setPose('${v}');`); });
    const cfg = c.cfg, outfits = cfg.OUTFITS ? Object.keys(cfg.OUTFITS) : [], hair = cfg.HAIR || [];
    document.getElementById('g-outfit').style.display = outfits.length > 1 || hair.length > 1 ? '' : 'none';
    if (outfits.length > 1 || hair.length > 1) {
      chips('c-outfit', outfits.map(o => ['o:' + o, o]).concat(hair.map(h => ['h:' + h, 'cabelo ' + h])), 'o:' + s.outfit, v => {
        const [k, val] = v.split(':');
        if (k === 'o') { c.setOutfit(val); log(`${name}.setOutfit('${val}');`); } else { c.setHair(val); log(`${name}.setHair('${val}');`); }
      });
    }
    const box = document.getElementById('c-acc');
    box.textContent = '';
    Object.keys(s.accessories).forEach(a => {
      const b = document.createElement('button');
      b.type = 'button';
      const paint = () => { const v = c.getState().accessories[a]; b.textContent = a + ': ' + (v === 'auto' ? 'pela pose' : v ? 'ligado' : 'desligado'); b.setAttribute('aria-pressed', String(v === true)); };
      paint();
      b.addEventListener('click', () => {
        const v = c.getState().accessories[a];
        const next = v === 'auto' ? true : v === true ? false : (['smartphone', 'laptop', 'teddy_bear', 'ball', 'seat'].includes(a) ? 'auto' : true);
        c.setAccessory(a, next); paint(); log(`${name}.setAccessory('${a}', ${next === 'auto' ? "'auto'" : next});`);
      });
      box.appendChild(b);
    });
  }

  async function showSingle() {
    stopScript(); scene.clear();
    await scene.add(who, { x: 960, direction: who === 'biscuit' ? 'right' : 'front' });
    renderControls();
  }
  async function showFamily() {
    stopScript(); scene.clear();
    for (const n of Object.keys(LINEUP)) await scene.add(n, { x: LINEUP[n], direction: n === 'biscuit' ? 'left' : 'front' });
    renderControls();
  }
  async function runScript() {
    stopScript();
    view = 'family';
    document.querySelector('#c-view [data-value="family"]').click();
    await new Promise(r => setTimeout(r, 50));
    const F = window.STH.FamilyScene;
    const cast = await F.setup(scene);
    chips('c-scene', [['', 'Transparente']].concat(window.STH.Backdrops.list().map(b => [b.id, b.label])), F.background, setScene);
    renderControls();
    F.beats.forEach(b => timers.push(setTimeout(() => { b.run(cast); renderControls(); }, b.t * 1000)));
    log('Cena de teste: família na cozinha, ' + F.duration + ' segundos.');
  }
  function setScene(v) { scene.setBackground(v || null); log(v ? `scene.setBackground('${v}');` : 'scene.setBackground(null);'); }

  chips('c-who', Object.entries(NAMES), who, async v => { who = v; if (view === 'single') await showSingle(); else renderControls(); });
  chips('c-view', [['single', 'Isolado'], ['family', 'Família']], view, async v => { view = v; if (v === 'single') await showSingle(); else await showFamily(); });
  chips('c-scene', [['', 'Transparente']].concat(window.STH.Backdrops.list().map(b => [b.id, b.label])), '', setScene);

  const actions = document.getElementById('actions');
  const act = (label, fn) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.addEventListener('click', fn); actions.appendChild(b); };
  act('Rodar cena de teste', runScript);
  act('Todos ao mesmo tempo', async () => {
    if (view !== 'family') document.querySelector('#c-view [data-value="family"]').click();
    await new Promise(r => setTimeout(r, 120));
    const c = scene.cast;
    if (c.dan) c.dan.setPose('walking').setExpression('happy');
    if (c.mia) c.mia.setPose('explaining').play('talking');
    if (c.leo) c.leo.setPose('texting');
    if (c.bea) c.bea.setPose('jumping').setExpression('excited');
    if (c.biscuit) c.biscuit.setPose('running');
    log('Cinco personagens com movimentos diferentes no mesmo relógio.');
  });
  act('Mostrar / ocultar', () => { const c = current(); if (c) { const on = !c.getState().visible; c.setVisible(on); log(`${c.name}.setVisible(${on});`); } });
  act('Copiar SVG da cena', async e => {
    const b = e.currentTarget, t = b.textContent;
    try { await navigator.clipboard.writeText(scene.toSVG()); b.textContent = 'SVG copiado'; } catch (err) { b.textContent = 'Cópia bloqueada'; }
    setTimeout(() => { b.textContent = t; }, 1500);
  });
  await showSingle();
})();
</script>
</body>
</html>
