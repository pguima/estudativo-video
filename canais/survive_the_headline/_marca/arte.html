<!doctype html><html><head><meta charset="utf-8"><title>Survive the Headline: arte do canal</title>
<style>
@font-face{font-family:Anton;src:url(../video/fonts/Anton-Regular.ttf)}
@font-face{font-family:Inter;font-weight:700;src:url(../video/fonts/Inter-Bold.otf)}
@font-face{font-family:Inter;font-weight:800;src:url(../video/fonts/Inter-ExtraBold.otf)}
:root{--ink:#0d1422;--panel:#101a2d;--line:#2a3a57;--red:#e8232c;--red2:#ff3b3b;--amber:#ffb627;--green:#35d07f;--cyan:#39c6f0}
html,body{margin:0;background:transparent}
#art{position:relative;overflow:hidden;font-family:Inter,sans-serif;color:#fff}
.who{position:absolute}.who>div{width:100%;height:100%}
.abs{position:absolute}
/* logotipo: faixa de telejornal */
.logo{position:absolute;display:inline-flex;flex-direction:column;align-items:flex-start;font-family:Anton;line-height:1;text-transform:uppercase}
.logo .l1{color:#fff;letter-spacing:.012em;background:var(--ink);padding:.13em .24em .1em .24em}
.logo .l2{color:#fff;background:var(--red);padding:.09em .2em .07em .2em;letter-spacing:.012em;margin-top:-.02em}
.panel{position:absolute;background:rgba(16,26,45,.94);border:3px solid var(--line);border-radius:18px;padding:24px 28px}
.panel h6{margin:0 0 16px;font:800 22px Inter;letter-spacing:.14em;color:var(--amber)}
.row{display:grid;grid-template-columns:104px 104px 1fr;align-items:center;gap:12px;font:800 25px Inter;margin:13px 0}
.row i{display:block;height:17px;border-radius:9px;background:#26324c;overflow:hidden}.row i b{display:block;height:100%;border-radius:9px}
